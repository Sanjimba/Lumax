<!doctype html>
<html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMAX | Administração</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="icon" href="logo-Photoroom.png" type="image/png"><link rel="stylesheet" href="css/admin.css"></head>
<body>
<div id="login" class="login"><section class="login-box" aria-labelledby="authTitle"><img src="logo-Photoroom.png" class="auth-logo" alt="LUMAX"><p class="eyebrow">ÁREA RESERVADA</p><h1 id="authTitle">Bem-vindo de volta</h1><p id="authIntro" class="auth-intro">Inicie sessão para gerir os conteúdos da Lumax.</p><div id="authMessage" class="alert" role="alert" hidden></div><button id="authRetry" type="button" class="link-button" hidden>Tentar novamente</button><form id="loginForm" class="auth-form"><label>Utilizador<input id="user" required autocomplete="username"></label><label>Palavra-passe<input id="pass" type="password" required autocomplete="current-password"></label><button id="loginButton" class="primary" type="submit"><span class="button-text">Entrar</span><span class="spinner" hidden></span></button></form><div class="auth-links"><button id="showRecovery" type="button" class="link-button">Esqueceu-se da palavra-passe?</button></div><form id="setupForm" class="auth-form" hidden><label>Utilizador<input id="setupUser" required pattern="[a-zA-Z0-9._-]{3,50}" title="Use 3 a 50 caracteres: letras, números, ponto, hífen ou underscore." autocomplete="username"></label><label>Palavra-passe<input id="setupPass" type="password" required minlength="12" autocomplete="new-password"></label><label>Confirmar palavra-passe<input id="setupPassConfirm" type="password" required minlength="12" autocomplete="new-password"></label><button id="setupButton" class="primary" type="submit"><span class="button-text">Criar conta de administrador</span><span class="spinner" hidden></span></button></form><form id="recoveryForm" class="auth-form" hidden><p class="auth-intro">Indique o utilizador. O código temporário será apresentado nos registos do servidor.</p><label>Utilizador<input id="recoveryUser" required autocomplete="username"></label><button id="recoveryButton" class="primary" type="submit"><span class="button-text">Gerar código</span><span class="spinner" hidden></span></button><button id="showReset" type="button" class="link-button" hidden>Já tenho um código</button><button type="button" class="link-button auth-back">Voltar ao login</button></form><form id="resetForm" class="auth-form" hidden><label>Utilizador<input id="resetUser" required autocomplete="username"></label><label>Código temporário<input id="resetCode" required autocomplete="one-time-code"></label><label>Nova palavra-passe<input id="resetPass" type="password" required minlength="12" autocomplete="new-password"></label><label>Confirmar nova palavra-passe<input id="resetPassConfirm" type="password" required minlength="12" autocomplete="new-password"></label><button id="resetButton" class="primary" type="submit"><span class="button-text">Repor palavra-passe</span><span class="spinner" hidden></span></button><button type="button" class="link-button auth-back">Voltar ao login</button></form></section></div>
<div id="app" hidden><aside><h2>LUMAX</h2><button data-tab="trust_steps">Confiança / Passos</button><button data-tab="services">Serviços</button><button data-tab="properties">Imóveis</button><button data-tab="posts">Publicações</button><button data-tab="gallery">Galeria</button><button data-tab="faq">FAQ</button><button data-tab="settings">Configurações</button><button data-tab="password">Alterar palavra-passe</button><a href="index.html">Ver site</a><button id="logout">Sair</button></aside><main><div id="panel"></div></main></div><script src="js/admin.js"></script></body></html>
